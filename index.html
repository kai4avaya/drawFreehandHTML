<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Shape Drawing Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .drawing-container {
            height: 300px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            overflow: hidden;
        }
        .drawing-container svg {
            width: 100%;
            height: 100%;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .result-container {
            position: relative;
            width: 100%;
            height: 300px;
            background-color: white;
            border-radius: 5px;
            overflow: visible;
        }
        .custom-component {
            background-color: #e8f0fe;
        }
        .custom-component textarea {
            resize: none;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .custom-component button {
            padding: 5px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .custom-component button:hover {
            background-color: #3267d6;
        }
        .instructions {
            background-color: #fff; /* White background */
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }
        .instructions h1 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.5em;
            color: #333;
        }
        .instructions p {
            margin-bottom: 0;
            color: #555;
            font-size: 0.9em;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="instructions">
            <h1>Weird Shape HTML Generator</h1>
                <div style="display: inline-block; text-align: left;">
                    1. Draw a closed shape in the box below.<br>
                    2. Click 'Create Component'.<br>
                    3. Type in the component.<br>
                    4. Repeat if desired (check 'Don't refresh').<br>
                    5. Download your creation.
                </div>
            </p>
        </div>
        <div class="drawing-container">
            <svg id="drawingCanvas"></svg>
        </div>
        <div class="controls">
            <button id="createComponentBtn">Create Component</button>
            <label><input type="checkbox" id="dontRefresh"> Don't refresh</label>
            <button id="downloadBtn">Download Creation</button>
        </div>
        <div class="result-container" id="resultContainer"></div>
    </div>

    <script>
        const svg = document.getElementById('drawingCanvas');
        const resultContainer = document.getElementById('resultContainer');
        const createComponentBtn = document.getElementById('createComponentBtn');
        const dontRefreshCheckbox = document.getElementById('dontRefresh');
        const downloadBtn = document.getElementById('downloadBtn');
        let isDrawing = false;
        let points = [];

        svg.addEventListener('mousedown', startDrawing);
        svg.addEventListener('mousemove', draw);
        svg.addEventListener('mouseup', stopDrawing);
        createComponentBtn.addEventListener('click', createComponent);
        downloadBtn.addEventListener('click', downloadCreation);

        function startDrawing(e) {
            isDrawing = true;
            const rect = svg.getBoundingClientRect();
            points = [{ x: e.clientX - rect.left, y: e.clientY - rect.top }];
            clearDrawingCanvas();
            drawPath();
        }

        function draw(e) {
            if (!isDrawing) return;
            const rect = svg.getBoundingClientRect();
            points.push({ x: e.clientX - rect.left, y: e.clientY - rect.top });
            drawPath();
        }

        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                drawPath(true);
            }
        }

        function drawPath(closePath = false) {
            svg.innerHTML = '';
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const d = points.reduce((acc, p, i) => {
                return i === 0 ? `M${p.x},${p.y}` : `${acc} L${p.x},${p.y}`;
            }, '') + (closePath ? ' Z' : '');
            path.setAttribute('d', d);
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke', 'black');
            path.setAttribute('stroke-width', '2');
            svg.appendChild(path);
        }

        function clearDrawingCanvas() {
            svg.innerHTML = '';
        }

        function clearDrawing() {
            points = [];
            clearDrawingCanvas();
        }

        function calculateBounds(points) {
            const xs = points.map(p => p.x);
            const ys = points.map(p => p.y);
            return {
                minX: Math.min(...xs),
                maxX: Math.max(...xs),
                minY: Math.min(...ys),
                maxY: Math.max(...ys),
                width: Math.max(...xs) - Math.min(...xs),
                height: Math.max(...ys) - Math.min(...ys)
            };
        }

        function calculateInnerRectangle(bounds) {
            const padding = 0.1;
            const innerWidth = bounds.width * (1 - 2 * padding);
            const innerHeight = bounds.height * (1 - 2 * padding);
            return {
                x: bounds.minX + bounds.width * padding,
                y: bounds.minY + bounds.height * padding,
                width: innerWidth,
                height: innerHeight
            };
        }

        function createComponent() {
            if (points.length < 3) {
                alert('Please draw a shape with at least 3 points');
                return;
            }

            if (!dontRefreshCheckbox.checked) {
                resultContainer.innerHTML = '';
            }

            const bounds = calculateBounds(points);
            const innerRect = calculateInnerRectangle(bounds);
            const polygonPoints = points.map(p => `${(p.x / svg.clientWidth) * 100}% ${(p.y / svg.clientHeight) * 100}%`).join(', ');

            const component = document.createElement('div');
            component.className = 'custom-component';
            component.style.position = 'absolute';
            component.style.left = '0';
            component.style.top = '0';
            component.style.width = '100%';
            component.style.height = '100%';
            component.style.clipPath = `polygon(${polygonPoints})`;
            component.style.backgroundColor = '#e8f0fe';

            const textarea = document.createElement('textarea');
            textarea.placeholder = 'Type your message here...';
            const textareaHeight = innerRect.height - 40;

            textarea.style.position = 'absolute';
            textarea.style.left = `${innerRect.x + 10}px`;
            textarea.style.top = `${innerRect.y + 10}px`;
            textarea.style.width = `${innerRect.width - 20}px`;
            textarea.style.height = `${textareaHeight - 20}px`;

            const sendButton = document.createElement('button');
            sendButton.textContent = 'Send';
            sendButton.style.position = 'absolute';
            sendButton.style.left = `${innerRect.x + innerRect.width - 70}px`;
            sendButton.style.top = `${innerRect.y + textareaHeight}px`;
            sendButton.style.width = '70px';

            sendButton.addEventListener('click', () => {
                if (textarea.value.trim()) {
                    alert(textarea.value);
                } else {
                    alert('Please type a message first');
                }
            });

            component.appendChild(textarea);
            component.appendChild(sendButton);
            resultContainer.appendChild(component);

            if (!dontRefreshCheckbox.checked) {
                clearDrawing();
            }
        }

        function downloadCreation() {
            const textareasInResult = resultContainer.querySelectorAll('textarea');
            textareasInResult.forEach(textarea => {
                textarea.textContent = textarea.value;
            });

            const styleContent = document.querySelector('style').innerHTML;
            const resultHtmlContent = resultContainer.outerHTML;

            const htmlContent = `
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Components</title>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
        }
        ${styleContent}
        .result-container {
            position: relative !important;
            width: 100% !important;
            max-width: 1000px !important;
            height: 300px !important;
            background-color: white !important;
            border-radius: 5px !important;
            overflow: visible !important;
            display: block !important;
        }
    </style>
</head>
<body>
    ${resultHtmlContent}
</body>
</html>
            `;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'custom_components.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
